[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "riir-airflow"
version = "0.1.0"
description = "Add your description here"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "apache-airflow>=3.4",
    "sh>=2.4.0",
    "orjson>=3.13.0",
]
readme = "README.md"
requires-python = ">=3.13"

[project.scripts]
riir-airflow = 'riir_airflow.__main__:cli_app'

[tool.maturin]
python-source = "python"
module-name = "riir_airflow._lowlevel"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "zensical>=0.1.3,<0.2",
    "prek>=0.5.11",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
