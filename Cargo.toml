[package]
name = "riir-airflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "riir_airflow"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal"] }
