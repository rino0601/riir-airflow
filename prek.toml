#:schema https://www.schemastore.org/prek.json

# 저장소 전체에 적용하는 최소 훅 모음.
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    # inline conflict marker 방지 (기존 check-merge-conflict 설정 계승)
    { id = "check-merge-conflict", args = ["--assume-in-merge"] },
]

# 저장소 검사의 단일 진입점인 mise run check를 커밋 훅에서 호출한다.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "mise-check"
name = "mise run check"
entry = "uv run mise run check"
language = "system"
pass_filenames = false
always_run = true
