repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      # Prevent committing inline conflict markers
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: local
    hooks:
      - id: lint
        name: just lint
        entry: .venv/bin/just lint --fix
        language: system
        pass_filenames: false
        always_run: true
      - id: format
        name: just format
        entry: .venv/bin/just format
        language: system
        pass_filenames: false
        always_run: true
