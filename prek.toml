#:schema https://www.schemastore.org/prek.json

# 저장소 전체에 적용하는 최소 훅 모음.
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    # inline conflict marker 방지 (기존 check-merge-conflict 설정 계승)
    { id = "check-merge-conflict", args = ["--assume-in-merge"] },
]

# 포맷을 먼저 적용한 뒤 저장소 전체를 검사한다.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "mise-format"
name = "mise run format"
entry = "uv run mise run format"
language = "system"
pass_filenames = false
always_run = true
# 파일이 바뀌면 변경 사항을 확인하고 다시 스테이징한 뒤 커밋한다.
fail_fast = true

[[repos.hooks]]
id = "mise-check"
name = "mise run check"
entry = "uv run mise run check"
language = "system"
pass_filenames = false
always_run = true
