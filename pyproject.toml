[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "riir-airflow"
version = "0.1.0"
description = "Add your description here"
dependencies = []
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
compat = [
    "a2wsgi>=1.10.10",
    "apache-airflow>=3.4",
    "sh>=2.4.0",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
riir-airflow = 'riir_airflow.__main__:cli_app'

[tool.maturin]
python-source = "python"
module-name = "riir_airflow._lowlevel"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "riir-airflow[compat]",
    "apache-airflow==3.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "zensical>=0.1.3,<0.2",
    "prek>=0.5.11",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.pytest.ini_options]
# 차분 테스트는 DAG 실행과 직렬화가 무거워 기본 pytest에서는 제외한다.
addopts = "-m 'not differential'"
markers = [
    "differential: apache-airflow와 riir-airflow를 같은 DAG로 비교 (mise run test-differential)",
]
